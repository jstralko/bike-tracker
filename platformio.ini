[platformio]
default_envs = tbeam_supreme

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib @ ^7.1.2

[env:tbeam_supreme]
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<tbeam_supreme/> -<feather_gateway/>
lib_deps =
  ${env.lib_deps}
  lewisxhe/XPowersLib @ ^0.3.0

[env:feather_m0]
platform = atmelsam
board = adafruit_feather_m0
build_src_filter = +<feather_gateway/> -<tbeam_supreme/>
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit GPS Library @ ^1.7.5

