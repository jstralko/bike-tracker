[platformio]
default_envs = tbeam_supreme

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
  jgromes/RadioLib @ ^7.1.2

[env:tbeam_supreme]
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_64:E8:33:5E:30:24-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_64:E8:33:5E:30:24-if00
platform = espressif32
board = esp32-s3-devkitc-1
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_qspi
build_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<tbeam_supreme/> -<feather_gateway/>
lib_deps =
  ${env.lib_deps}
  lewisxhe/XPowersLib @ ^0.3.0
  adafruit/Adafruit SH110X @ ^2.1.12

[env:feather_esp32s3_tft]
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_D0:CF:13:0A:E4:B8-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_D0:CF:13:0A:E4:B8-if00
; Leave DTR/RTS unspecified: explicitly forcing them can reset native USB
; Serial/JTAG into download mode when the monitor opens.
; Use the ESP32 USB JTAG/serial interface directly rather than a UF2 reset.
board_upload.use_1200bps_touch = no
board_upload.wait_for_upload_port = no
platform = espressif32
board = adafruit_feather_esp32s3_tft
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DFEATHER_MAIN_BOARD_TEST=1
  -DFEATHER_TEST_STAGE=2
  ; Verified RFM95W wiring: CS->B, RST->GPIO11 bypass, IRQ->D.
  -DFEATHER_RADIO_CS=10
  -DFEATHER_RADIO_RST=11
  -DFEATHER_RADIO_IRQ=6
build_src_filter = +<feather_gateway/> -<tbeam_supreme/>
; Ping/pong radio test; GPS is excluded.
lib_deps =
  ${env.lib_deps}
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.11.0
  adafruit/Adafruit MAX1704X
  adafruit/Adafruit LC709203F
